{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>StockPredictor - Admin Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="d-flex align-items-center justify-content-center py-5">

	<div class="container py-5">
		<div class="row justify-content-center animate-fade-in-up">
			<div class="col-md-6 col-lg-5">
				<div class="glass-card text-center border-danger border-opacity-25">
					<div class="mb-4">
						<div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
							style="width: 80px; height: 80px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);">
							<i class="fas fa-user-shield text-danger fs-1"></i>
						</div>
						<h2 class="fw-bold text-danger mb-2">Admin Login</h2>
						<p class="text-secondary">Authentication required for Service Provider access</p>
					</div>

					<form method="POST" role="form" class="text-start">
						{% csrf_token %}
						<div class="mb-4">
							<label class="form-label text-secondary small text-uppercase">Admin Username</label>
							<div class="input-group">
								<span
									class="input-group-text bg-transparent border-secondary text-secondary border-opacity-25"><i
										class="fas fa-crown"></i></span>
								<input type="text" name="username"
									class="form-control form-control-glass border-start-0 border-secondary border-opacity-25"
									placeholder="Enter admin ID" required>
							</div>
						</div>
						<div class="mb-4">
							<label class="form-label text-secondary small text-uppercase">Admin Password</label>
							<div class="input-group">
								<span
									class="input-group-text bg-transparent border-secondary text-secondary border-opacity-25"><i
										class="fas fa-key"></i></span>
								<input type="password" name="password"
									class="form-control form-control-glass border-start-0 border-secondary border-opacity-25"
									placeholder="Enter password" required>
							</div>
						</div>

						<div class="d-grid mt-5">
							<button type="submit" name="submit1" class="btn btn-dynamic"
								style="background: linear-gradient(to right, #EF4444, #991B1B);">
								Authenticate <i class="fas fa-lock-open ms-2"></i>
							</button>
						</div>
					</form>

					<div class="mt-4 pt-3 border-top border-danger border-opacity-25">
						<a href="{% url 'login' %}" class="text-secondary small text-decoration-none">Return to User
							Login</a>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
