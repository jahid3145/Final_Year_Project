{% extends 'SProvider/Header.html' %}
{% load static %}
{% block title %}Sentiment Analytics (Alternative) - Admin Dashboard{% endblock %}

{% block extra_css %}
<style>
     .canvasjs-chart-container {
          border-radius: 12px;
          /* overflow: hidden removed to fix chart invisible issue */
     }
</style>
{% endblock %}

{% block researchblock %}
<div class="row">
     <div class="col-lg-3 mb-4 animate-fade-in-up">
          <div class="glass-card h-100">
               <h5 class="text-primary border-bottom border-secondary pb-3 mb-4">View Mode</h5>
               <div class="d-grid gap-3">
                    <a href="{% url 'dislikeschart' 'pie' %}"
                         class="btn btn-outline-info d-flex justify-content-between align-items-center p-3 {% if dislike_chart == 'pie' %}active bg-primary border-primary text-white{% endif %}">
                         <span><i class="fas fa-chart-pie me-2"></i> Pie Chart</span>
                         <i class="fas fa-chevron-right small opacity-50"></i>
                    </a>
                    <a href="{% url 'dislikeschart' 'bar' %}"
                         class="btn btn-outline-info d-flex justify-content-between align-items-center p-3 {% if dislike_chart == 'bar' %}active bg-primary border-primary text-white{% endif %}">
                         <span><i class="fas fa-chart-bar me-2"></i> Bar Chart</span>
                         <i class="fas fa-chevron-right small opacity-50"></i>
                    </a>
                    <a href="{% url 'dislikeschart' 'spline' %}"
                         class="btn btn-outline-info d-flex justify-content-between align-items-center p-3 {% if dislike_chart == 'spline' %}active bg-primary border-primary text-white{% endif %}">
                         <span><i class="fas fa-wave-square me-2"></i> Spline Chart</span>
                         <i class="fas fa-chevron-right small opacity-50"></i>
                    </a>
               </div>
          </div>
     </div>

     <div class="col-lg-9 animate-fade-in-up delay-100">
          <div class="glass-card">
               <h3 class="text-primary mb-4 fw-bold">Alternative Sentiment Visualization</h3>
               
               <div class="p-3 mt-4 rounded-4 shadow-lg animate-fade-in-up delay-200" style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border);">
                   <div id="chartErrorDump" class="text-danger p-3 fw-bold bg-dark mb-3" style="display:none; white-space: pre-wrap;"></div>
                   <div id="dislikeChartContainer" class="chart-container" style="height: 500px; width: 100%; border: none; background: transparent;"></div>
               </div>
          </div>
     </div>
</div>

<script src="{% static 'canvasjs.min.js' %}"></script>
<script>
     window.onerror = function(msg, url, line, col, error) {
         var errObj = document.getElementById("chartErrorDump");
         errObj.style.display = "block";
         errObj.innerHTML += `🚨 JS Error: ${msg}\nLine: ${line}, Col: ${col}\n`;
     };
</script>
<script>
     window.onload = function () {
          CanvasJS.addColorSet("brightGradients", ["#38BDF8", "#34D399", "#818CF8", "#FBBF24", "#F472B6", "#A78BFA"]);

          var chart = new CanvasJS.Chart("dislikeChartContainer", {
               backgroundColor: "transparent",
               height: 500,
               colorSet: "brightGradients",
               animationEnabled: true,
               animationDuration: 1500,
               theme: "dark2",
               title: { text: "", fontFamily: "Inter" },
               axisX: {
                    labelFontFamily: "Inter",
                    labelFontColor: "#cbd5e1",
                    lineColor: "rgba(255,255,255,0.1)",
                    tickColor: "rgba(255,255,255,0.1)"
               },
               axisY: {
                    labelFontFamily: "Inter",
                    labelFontColor: "#cbd5e1",
                    gridThickness: 0.5,
                    gridColor: "rgba(255,255,255,0.05)",
                    lineColor: "rgba(255,255,255,0.1)",
                    tickColor: "rgba(255,255,255,0.1)"
               },
               legend: {
                    fontFamily: "Inter",
                    fontColor: "#e2e8f0"
               },
               data: [{
            {% if dislike_chart == "bar" %}
                type: "bar",
               {% elif dislike_chart == "pie" %}
               type: "pie",
               showInLegend: true,
               toolTipContent: "{label}: <strong>{y}%</strong>",
               indexLabel: "{label} - {y}%",
               indexLabelFontColor: "#e2e8f0",
               indexLabelFontFamily: "Inter",
               indexLabelFontWeight: "bold",
                         {% elif dislike_chart == "spline" %}
               type: "spline",
               lineThickness: 3,
               markerSize: 10,
          {% endif %}
               dataPoints: [
          {% for o in form %}
               { 
                   y: {{ o.dcount|default:0 }}, 
                   label: "{{o.names}}",
                   color: "{% if o.names == 'Downtrends' %}#EF4444{% elif o.names == 'Uptrends' %}#10B981{% else %}#38BDF8{% endif %}"
               },
          {% endfor %}
            ]
        }]
    });
     chart.render();
}
</script>
{% endblock %}
