{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPredictor - User Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand fs-4" href="{% url 'index' %}">
                <i class="fas fa-chart-line me-2"></i>StockPredictor
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'login' %}">User Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'serviceproviderlogin' %}">Admin Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5 mt-5">
        <div class="row justify-content-center animate-fade-in-up">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card text-center">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 80px; height: 80px; background: rgba(79, 70, 229, 0.1); border: 1px solid rgba(79, 70, 229, 0.3);">
                            <i class="fas fa-user text-gradient fs-1"></i>
                        </div>
                        <h2 class="fw-bold text-gradient">Welcome Back</h2>
                        <p class="text-secondary">Login your remote user account to continue</p>
                    </div>

                    <form method="POST" role="form" class="text-start">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label text-secondary small text-uppercase">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fas fa-at"></i></span>
                                <input type="text" name="username" class="form-control form-control-glass border-start-0" placeholder="Enter username" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary small text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fas fa-lock"></i></span>
                                <input type="password" name="password" class="form-control form-control-glass border-start-0" placeholder="Enter password" required>
                            </div>
                        </div>
                        
                        <div class="d-grid mt-5">
                            <button type="submit" name="submit1" class="btn btn-dynamic">Sign In <i class="fas fa-sign-in-alt ms-2"></i></button>
                        </div>
                    </form>

                    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <p class="text-secondary small mb-0">Don't have an account? <a href="{% url 'Register1' %}" class="accent-indigo text-decoration-none fw-600">Register Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
